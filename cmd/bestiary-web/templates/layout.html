{{define "layout" -}}
<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · bestiary</title>
  <meta name="description" content="bestiary — a browsable catalog of model entities, their nomina, provenance and VRAM.">
  <!-- Fonts: CDN permitted for FONTS ONLY (RQ1). Full offline fallback stack declared in
       CSS below and font-display:swap set upstream, so the page never blocks or shows
       invisible text if the CDN is unreachable (captive network / air-gapped demo). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Share+Tech+Mono&display=swap">
  <style>
    /* ===== Phosphor Terminal — approved direction (docs/design/v0.2.8-web-direction.md).
       Palette tokens are the §2.1 table verbatim. Light is the default in :root (a
       gruvbox-light / pipboy amber-brown-on-sepia register); dark is applied by
       prefers-color-scheme and both are overridable by an explicit [data-theme]. ===== */
    :root {
      --bg: #fbf1c7;            /* gruvbox-light bg0, warm cream paper */
      --surface: #f9f5d7;       /* gruvbox-light bg0_h */
      --text: #3c3836;          /* gruvbox-light fg, near-black warm — table body, NOT amber */
      --text-muted: #7c6f64;    /* gruvbox gray */
      --accent: #96621b;        /* pipboy amber-brown chrome, darkened for contrast on cream */
      --accent-dim: #d5c4a1;    /* gruvbox-light bg2, warm tan — hairlines */
      --accent-bright: #427b58; /* faded green — "live/attested" badges */
      --info: #458588;          /* faded aqua — modality/capability badges */
      --warn: #af3a03;          /* orange — partial-estimate / deferred-data */
      --danger: #9d0006;        /* faded red — parse-failure / unlinked (admin-facing) */
      --border: #d5c4a1;

      --font-display: "Saira Condensed", system-ui, sans-serif;
      --font-mono: "Share Tech Mono", ui-monospace, Menlo, monospace;
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

      --space-1: 4px; --space-2: 8px; --space-3: 16px; --space-4: 24px; --space-5: 32px;

      /* ===== Type scale (D2 readability). EVERY font-size in this stylesheet resolves
         through one of these steps — there is no literal font-size value anywhere below,
         which is what the grep guard in the test suite enforces.

         The steps are named --fs-* and deliberately NOT --text-*: --text and --text-muted
         are already COLOR tokens above, so a --text-* size prefix would read as a color and
         could collide outright on a future step name.

         Steps are rem-based so a reader who raises their browser's base font size scales
         the whole page with it; a px literal would silently ignore that preference. 1rem is
         16px at the browser default. The scale is a modest, UNIFORM readability lift over
         the pre-scale sizes — each of the old 12/13/14/15px literals moves up exactly one
         step — so the dense-table density is preserved while the smallest text on the page
         stops being 12px. Headings, which carried no explicit size at all, are on it too. */
      --fs-xs: 0.8125rem;   /* 13px — smallest text: badges, filter labels, footer */
      --fs-sm: 0.875rem;    /* 14px — secondary chrome: form controls, sub-tables */
      --fs-base: 0.9375rem; /* 15px — the dense data grid */
      --fs-body: 1rem;      /* 16px — running prose, disclosure summaries */
      --fs-lg: 1.125rem;    /* 18px — section sub-headings (h2) */
      --fs-xl: 1.5rem;      /* 24px — page title (h1) */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0908; --surface: #141210; --text: #ece6d8; --text-muted: #9b9285;
        --accent: #f0b32a; --accent-dim: #7a5a14; --accent-bright: #54ff8a;
        --info: #39d6c8; --warn: #ff6a1f; --danger: #ff3b2f; --border: #3a2c0a;
      }
    }
    /* Explicit toggle wins over the media query in BOTH directions. */
    :root[data-theme="light"] {
      --bg: #fbf1c7; --surface: #f9f5d7; --text: #3c3836; --text-muted: #7c6f64;
      --accent: #96621b; --accent-dim: #d5c4a1; --accent-bright: #427b58;
      --info: #458588; --warn: #af3a03; --danger: #9d0006; --border: #d5c4a1;
    }
    :root[data-theme="dark"] {
      --bg: #0a0908; --surface: #141210; --text: #ece6d8; --text-muted: #9b9285;
      --accent: #f0b32a; --accent-dim: #7a5a14; --accent-bright: #54ff8a;
      --info: #39d6c8; --warn: #ff6a1f; --danger: #ff3b2f; --border: #3a2c0a;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-body); font-size: var(--fs-body); line-height: 1.5;
      min-height: 100vh;
    }
    /* One scanline layer only (§2.3), on the page chrome, never over the data grid.
       Static by default; the flicker only exists where motion is allowed. */
    body::after {
      content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      mix-blend-mode: multiply; opacity: 0.08;
      background: repeating-linear-gradient(
        to bottom, rgba(0,0,0,0.55) 0, rgba(0,0,0,0.55) 1px, transparent 1px, transparent 3px);
    }
    @media (prefers-reduced-motion: no-preference) {
      body::after { animation: scanflick 6s steps(60) infinite; }
      @keyframes scanflick { 0%,100% { opacity: .08; } 50% { opacity: .05; } }
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .chrome {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .wordmark {
      font-family: var(--font-display); font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--accent);
      text-shadow: 0 0 6px color-mix(in srgb, var(--accent) 55%, transparent);
    }
    .theme-toggle {
      font-family: var(--font-mono); cursor: pointer;
      background: var(--bg); color: var(--accent);
      border: 1px solid var(--border); border-radius: 2px;
      padding: var(--space-1) var(--space-2);
    }
    .theme-toggle:hover { text-shadow: 0 0 6px color-mix(in srgb, var(--accent) 55%, transparent); }

    main { padding: var(--space-4) var(--space-3); max-width: 72rem; margin: 0 auto; }

    h1, h2, .section-head {
      font-family: var(--font-display); font-weight: 600; letter-spacing: .03em;
      color: var(--accent);
    }
    /* Headings carried no explicit size before the scale (they inherited the UA's
       2em/1.5em), which is why they were the one part of the page the scale did not
       govern. They are on it now. */
    h1 { font-size: var(--fs-xl); }
    h2 { font-size: var(--fs-lg); }
    .section-head {
      text-transform: uppercase; font-size: var(--fs-sm); letter-spacing: .08em;
      border-bottom: 1px solid var(--border); padding-bottom: var(--space-1);
      margin: var(--space-4) 0 var(--space-2);
    }
    .muted { color: var(--text-muted); }
    .mono { font-family: var(--font-mono); }
    code, .key { font-family: var(--font-mono); }

    /* Dense table: high-contrast, scannable — retro skin stays on the chrome (§17.7). */
    table { width: 100%; border-collapse: collapse; font-size: var(--fs-base); }
    th {
      text-align: left; font-family: var(--font-mono); color: var(--accent);
      border-bottom: 1px solid var(--border); padding: var(--space-1) var(--space-2);
      font-weight: 400;
    }
    td { padding: var(--space-1) var(--space-2); border-bottom: 1px solid var(--accent-dim); }
    .num { font-variant-numeric: tabular-nums; text-align: right; }

    .badge {
      display: inline-block; font-family: var(--font-mono); font-size: var(--fs-xs);
      padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor;
    }
    .badge.info { color: var(--info); }
    .badge.live { color: var(--accent-bright); }
    .badge.warn { color: var(--warn); }
    /* VRAM mini-bar: a single-hue amber sequential fill. A PARTIAL (weights-only)
       estimate is drawn hollow + dashed so it never implies precision the data lacks —
       the visual echo of the "partial" label and the CLI's honesty convention. */
    .vram-cell { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
    .vram-bar {
      display: inline-block; min-width: 2px; height: 8px; border-radius: 1px;
      background: var(--accent); opacity: .85; vertical-align: middle;
    }
    .vram-bar.partial {
      background: transparent;
      border: 1px dashed var(--warn);
      opacity: 1;
    }

    /* Browser layout: a collapsible left filter rail beside the scrolling results. */
    .browse-head h1 { margin-bottom: var(--space-1); }
    .browse-layout { display: grid; grid-template-columns: 14rem 1fr; gap: var(--space-4); align-items: start; }
    .filter-rail { display: flex; flex-direction: column; gap: var(--space-3); }
    .filter { display: flex; flex-direction: column; gap: var(--space-1); }
    .filter-label {
      font-family: var(--font-mono); font-size: var(--fs-xs); text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-muted);
    }
    .filter select, .filter input[type="search"] {
      width: 100%; padding: var(--space-1) var(--space-2);
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 2px;
      font-family: var(--font-mono); font-size: var(--fs-sm);
    }
    .browse-results { overflow-x: auto; }
    table.browse { min-width: 48rem; }
    table.browse .badge { margin: 0 2px 2px 0; }

    /* Detail: quant tables, nomina + attestation sub-tables, lineage list. */
    .ctx-form { display: flex; align-items: center; gap: var(--space-2); margin: var(--space-2) 0; font-size: var(--fs-sm); }
    .ctx-form input[type="number"] {
      width: 8rem; padding: var(--space-1) var(--space-2);
      background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 2px;
      font-family: var(--font-mono);
    }
    .ctx-form button {
      font-family: var(--font-mono); cursor: pointer;
      background: var(--bg); color: var(--accent);
      border: 1px solid var(--border); border-radius: 2px; padding: var(--space-1) var(--space-2);
    }
    .quant-inst { margin: var(--space-3) 0 var(--space-1); font-size: var(--fs-sm); }
    table.quants { margin-bottom: var(--space-2); }
    /* Per-identifier metadata rows. The separation between rows is SEMANTIC, not
       decoration: a benchmark score is a lab-reported claim attributable to the
       identifier it was published under, so two identifiers' claims must never read as
       one merged table. The left rule and the per-table caption are what keep the
       attribution visible when several rows stack. Mirrors the .nomen block below,
       which groups a name's attestations the same way and for the same reason. */
    .metadata-row {
      margin: var(--space-3) 0; padding-left: var(--space-3);
      border-left: 2px solid var(--accent-dim);
    }
    .metadata-head {
      display: flex; align-items: center; gap: var(--space-2);
      margin-bottom: var(--space-1);
    }
    .metadata-id { color: var(--text); }
    table.benchmarks { width: auto; min-width: 32rem; }
    table.benchmarks th, table.benchmarks td { font-size: var(--fs-sm); }
    /* Browsers centre a <caption> by default, which reads as a title floating above an
       unrelated table; left-aligning it ties the claim count to the row it belongs to. */
    table.benchmarks caption {
      caption-side: top; text-align: left; font-size: var(--fs-xs);
      padding-bottom: var(--space-1);
    }

    .nomen { margin: var(--space-3) 0; }
    .nomen-head { margin-bottom: var(--space-1); }
    .nomen-value { color: var(--text); }
    table.attestations { width: auto; min-width: 32rem; }
    table.attestations th, table.attestations td { font-size: var(--fs-sm); }
    .break { word-break: break-all; }
    ul.lineage { list-style: none; padding: 0; }

    /* Disclosure tree — shared by the front-page Creator > Family > Series walk and the
       flat /families walk, because both render the same "series-subtree" partial. Each
       level indents from its parent so the hierarchy is legible at a glance; only the
       depth of the indent distinguishes them, since a level is a level. */
    .tree details { border-bottom: 1px solid var(--accent-dim); }
    .tree summary { cursor: pointer; }
    .creator-node > summary { padding: var(--space-2) 0; font-size: var(--fs-lg); color: var(--accent); }
    .creator-name { font-family: var(--font-display); letter-spacing: .04em; text-transform: uppercase; }
    .family-node { margin-left: var(--space-3); }
    .family-node > summary { padding: var(--space-2) 0; font-size: var(--fs-body); color: var(--accent); }
    .family-name { font-family: var(--font-display); letter-spacing: .03em; }
    .series-node { margin-left: var(--space-3); }
    .series-node > summary {
      padding: var(--space-2) 0; font-size: var(--fs-body); color: var(--accent);
    }
    .series-name { font-family: var(--font-display); letter-spacing: .03em; }
    .release-node { margin-left: var(--space-4); }
    .release-node > summary { padding: var(--space-1) 0; }
    ul.release-entities { list-style: none; padding: 0 0 var(--space-2) var(--space-4); margin: 0; }
    ul.release-entities li { padding: 1px 0; }

    /* THE BASE HOIST, visually. A line's un-named entities hang directly off the series
       rather than under a "(base)" node. On a MIXED line they render above the release
       disclosures while belonging to a DIFFERENT level of the hierarchy, so they get a
       legend and a left rule to say so — adjacency on screen must not be mistaken for
       sameness of level. A base-only line has no releases to be confused with, so it is
       left plain and the entities simply are the line. */
    .hoisted.mixed { border-left: 2px solid var(--accent-dim); margin-left: var(--space-3); }
    .hoisted-legend {
      font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em;
      padding: var(--space-1) 0 0 var(--space-4);
    }

    /* ===== BEGIN calculator block — the budget-first fit page. Kept contiguous and
       delimited so it merges as one hunk. It adds no token and no rule outside these
       selectors: every size resolves through the --fs-* scale and every colour through
       the palette tokens above. ===== */
    .calc-coverage {
      max-width: 60rem; font-size: var(--fs-sm); line-height: 1.6;
      border-left: 2px solid var(--accent-dim); padding-left: var(--space-3);
      margin: 0 0 var(--space-3);
    }
    /* The coverage statement is prose a reader must actually read before trusting a
       figure, so it is set at body measure and not shrunk into chrome. Its emphasised
       runs carry the denominators and the two qualifications. */
    .calc-coverage strong { color: var(--text); font-weight: 600; }
    .calc-summary { font-size: var(--fs-sm); margin: 0 0 var(--space-2); }
    .calc-bound { font-size: var(--fs-xs); }
    table.calc { min-width: 52rem; }
    table.calc .badge { white-space: nowrap; }
    /* A per-control note explaining what a knob does to the answer. Headroom and the
       context floor both change the verdict in ways a bare label cannot convey, and an
       unexplained knob gets left at its preset. */
    .filter-note { font-size: var(--fs-xs); line-height: 1.4; }
    /* ===== END calculator block ===== */
    /* ===== BEGIN command palette =========================================================
       A native <dialog> holding an ARIA combobox. The dialog is what gives the modal scrim,
       the focus trap and Esc-to-dismiss for free — all three are behaviours you otherwise
       hand-write and get subtly wrong. Nothing here is a framework: the only script is the
       small keyboard handler at the foot of this file, and the option list is server-rendered
       through the existing SSE fragment seam. */
    .chrome .palette-trigger {
      flex: 1; max-width: 32rem; text-align: left; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
      padding: var(--space-1) var(--space-2);
      background: var(--bg); color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 2px;
      font-family: var(--font-mono); font-size: var(--fs-base);
    }
    .chrome .palette-trigger:hover { color: var(--text); border-color: var(--accent); }
    .palette-kbd {
      font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--accent);
      border: 1px solid var(--border); border-radius: 2px; padding: 0 var(--space-1);
    }
    dialog.palette {
      width: min(40rem, 92vw); padding: 0; margin-top: 12vh;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--accent); border-radius: 2px;
    }
    dialog.palette::backdrop { background: rgba(0, 0, 0, .55); }
    .palette-input {
      width: 100%; padding: var(--space-3);
      background: transparent; color: var(--text);
      border: 0; border-bottom: 1px solid var(--border); border-radius: 0;
      font-family: var(--font-mono); font-size: var(--fs-body);
    }
    .palette-input:focus { outline: none; }
    ul.palette-results {
      list-style: none; margin: 0; padding: var(--space-1) 0;
      max-height: 50vh; overflow-y: auto;
    }
    .palette-opt {
      display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3);
      padding: var(--space-1) var(--space-3); cursor: pointer;
      font-size: var(--fs-base);
    }
    /* The HIGHLIGHT is drawn on aria-selected, not on :focus, because DOM focus never leaves
       the input — the arrow keys move aria-activedescendant. Styling the state the ARIA
       attribute already carries is what keeps the visible highlight and the announced one
       from ever disagreeing. */
    .palette-opt[aria-selected="true"] {
      background: color-mix(in srgb, var(--accent) 22%, transparent);
      color: var(--text);
    }
    .palette-opt:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .palette-attr { font-size: var(--fs-xs); white-space: nowrap; }
    .palette-note { padding: var(--space-2) var(--space-3); font-size: var(--fs-sm); }
    .palette-hint {
      margin: 0; padding: var(--space-2) var(--space-3); font-size: var(--fs-xs);
      border-top: 1px solid var(--border);
    }
    /* ===== END command palette =========================================================== */

    @media (max-width: 768px) {
      .browse-layout { grid-template-columns: 1fr; }
    }
    .footer { color: var(--text-muted); font-size: var(--fs-xs); padding: var(--space-4) var(--space-3); }
  </style>
</head>
<body>
  <header class="chrome">
    <span class="wordmark">bestiary&#9646;</span>
    <!-- ===== BEGIN command palette (trigger) ===== -->
    <button type="button" class="palette-trigger" aria-haspopup="dialog" aria-label="search entities"
            onclick="__paletteOpen()">
      <span>search entities…</span><span class="palette-kbd">&#8984;K</span>
    </button>
    <!-- ===== END command palette (trigger) ===== -->
    <button type="button" class="theme-toggle" aria-label="toggle color theme" onclick="__toggleTheme()">&#9790;/&#9728;</button>
  </header>
  <main id="main">
    {{template "content" .}}
  </main>
  <footer class="footer">
    bestiary · offline catalog · datastar client v{{.DatastarVersion}} (vendored)
  </footer>

  <!-- ===== BEGIN command palette (dialog) =================================================
       Entity SEARCH AND NAVIGATE, and nothing else. There are deliberately no page-nav or
       view-action rows: every option resolves to one entity URL, so Enter always means the
       same thing no matter what is highlighted.

       Structure is the canonical ARIA combobox: the INPUT keeps DOM focus and owns
       aria-activedescendant, the popup is a listbox of options, and the arrow keys move that
       pointer rather than focus — which is what lets a reader keep typing while arrowing.
       The whole thing sits in a native <dialog>, so the scrim, the focus trap and
       Esc-to-dismiss are the platform's, not ours.

       The hotkey element carries Datastar's own __window keydown binding — the global hook
       ships with the vendored client, so ⌘K costs no new dependency. -->
  <div id="palette-hotkey" aria-hidden="true"
       data-on-keydown__window="(evt.key === 'k' || evt.key === 'K') &amp;&amp; (evt.metaKey || evt.ctrlKey) &amp;&amp; !evt.altKey &amp;&amp; (evt.preventDefault(), __paletteOpen())"></div>
  <dialog id="palette" class="palette" aria-label="entity search">
    <!-- The signal is declared HYPHENATED (data-signals-palette-query) and NOT camelCase:
         the HTML parser lowercases attribute NAMES, so a camelCase attribute would reach the
         client as "palettequery" and silently never match the paletteQuery signal the server
         reads. Datastar folds the kebab name back to camelCase, so the hyphenated attribute
         is the only spelling that survives the round trip. -->
    <div data-signals-palette-query="''">
      <input id="palette-input" type="text" class="palette-input"
             role="combobox" aria-expanded="true" aria-controls="palette-results"
             aria-autocomplete="list" aria-label="search entities"
             autocomplete="off" spellcheck="false" placeholder="search entities…"
             data-bind-palette-query
             data-on-input__debounce.150ms="@get('/sse/palette')"
             onkeydown="__paletteKey(event)">
      <ul id="palette-results" class="palette-results" role="listbox" aria-label="matching entities"
          onclick="__paletteClick(event)">
        {{template "palette-prompt"}}
      </ul>
      <p class="palette-hint muted">&#8593;&#8595; move · enter opens · esc closes</p>
    </div>
  </dialog>

  <!-- Palette keyboard handler: our own small script (not a framework), same footing as the
       theme toggle above. No network, no external dependency — the option rows themselves are
       server-rendered through the SSE seam. -->
  <script>
    (function () {
      function el(id) { return document.getElementById(id); }
      function input() { return el("palette-input"); }
      function options() {
        var list = el("palette-results");
        return list ? list.querySelectorAll('li[role="option"]') : [];
      }
      // activeIndex reads the pointer back OUT of the DOM rather than caching it in a
      // variable, so a server patch that replaced the list can never leave the handler
      // pointing at a row that is no longer on screen.
      function activeIndex() {
        var inp = input(), opts = options();
        if (!inp) { return -1; }
        var id = inp.getAttribute("aria-activedescendant");
        for (var i = 0; i < opts.length; i++) { if (opts[i].id === id) { return i; } }
        return -1;
      }
      function setActive(i) {
        var inp = input(), opts = options();
        if (!inp) { return; }
        for (var j = 0; j < opts.length; j++) {
          opts[j].setAttribute("aria-selected", j === i ? "true" : "false");
        }
        if (i < 0 || i >= opts.length) { inp.removeAttribute("aria-activedescendant"); return; }
        inp.setAttribute("aria-activedescendant", opts[i].id);
        if (opts[i].scrollIntoView) { opts[i].scrollIntoView({ block: "nearest" }); }
      }
      function navigate(li) {
        var path = li && li.getAttribute("data-path");
        if (path) { window.location.assign(path); }
      }

      window.__paletteOpen = function () {
        var d = el("palette");
        if (!d || !d.showModal) { return; }
        if (!d.open) { d.showModal(); }
        var inp = input();
        if (inp) { inp.focus(); if (inp.select) { inp.select(); } }
      };
      window.__paletteClose = function () {
        var d = el("palette");
        if (d && d.open) { d.close(); }
      };
      // __paletteKey never moves focus: ArrowUp/ArrowDown only rewrite
      // aria-activedescendant, and the default (caret-to-end-of-field) is suppressed so the
      // text cursor does not jump while the reader is arrowing through results.
      window.__paletteKey = function (evt) {
        if (evt.key === "ArrowDown") {
          evt.preventDefault();
          var n = options().length;
          if (n) { setActive((activeIndex() + 1 + n) % n); }
        } else if (evt.key === "ArrowUp") {
          evt.preventDefault();
          var m = options().length;
          if (m) { var i = activeIndex(); setActive(i < 0 ? m - 1 : (i - 1 + m) % m); }
        } else if (evt.key === "Enter") {
          evt.preventDefault();
          var opts = options();
          if (!opts.length) { return; }
          var k = activeIndex();
          navigate(opts[k < 0 ? 0 : k]);
        }
        // Escape is deliberately absent: the native <dialog> already closes on it.
      };
      window.__paletteClick = function (evt) {
        var li = evt.target && evt.target.closest ? evt.target.closest('li[role="option"]') : null;
        if (li) { evt.preventDefault(); navigate(li); }
      };

      // The server replaces the option list wholesale on every keystroke, so the pointer is
      // re-anchored to the first row after each patch. Without this the input would keep
      // citing an id that the patch removed, and a screen reader would announce a row that
      // is no longer there.
      function watch() {
        var list = el("palette-results");
        if (!list || !window.MutationObserver) { return; }
        new MutationObserver(function () {
          setActive(options().length ? 0 : -1);
        }).observe(list, { childList: true });
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", watch);
      } else {
        watch();
      }
    })();
  </script>
  <!-- ===== END command palette (dialog) =================================================== -->

  <!-- Theme toggle: our own tiny script (not a framework); persists the explicit choice.
       No network, no external dependency. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("bestiary-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
      window.__toggleTheme = function () {
        var el = document.documentElement;
        var cur = el.getAttribute("data-theme");
        var next = cur === "dark" ? "light"
          : cur === "light" ? "dark"
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
        el.setAttribute("data-theme", next);
        try { localStorage.setItem("bestiary-theme", next); } catch (e) {}
      };
    })();
  </script>
  <!-- Datastar client — VENDORED, same-origin, version-pinned (see assets.go). NO CDN for JS. -->
  <script type="module" src="/assets/datastar.js"></script>
</body>
</html>
